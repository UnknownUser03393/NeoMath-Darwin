[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "neomath"
version = "1.0.0"
description = "NeoMath - The Debugger for Mathematics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "NeoMath Team"}]
dependencies = ["pywebview==6.2.1"]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "sympy==1.14.0",
  "ruff==0.16.1",
  "mypy==2.3.0",
  "pyinstaller==6.21.0",
  "python-pptx==1.0.2",
]

[project.scripts]
neomath = "neomath.__main__:main"

[tool.scikit-build]
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/neomath"]
sdist.include = ["cpp/**", "src/neomath/ui/**", "tests/**", "docs/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["neomath"]

[[tool.mypy.overrides]]
module = "neomath_core"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sympy.*"
ignore_missing_imports = true
