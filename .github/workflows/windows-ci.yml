name: Windows Verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  notebook-spa:
    name: Notebook SPA build
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui-mockups

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: ui-mockups/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Lint and unit tests
        run: |
          npm run lint
          node --test tests/*.test.mjs

      - name: Build SPA (AOT into desktop)
        run: npm run build:spa

      - name: Assert AOT notebook index exists
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $index = "desktop/src/neomath/ui/notebook/index.html"
          if (-not (Test-Path $index)) {
            throw "Missing AOT notebook product at $index after build:spa"
          }
          Write-Host "SPA AOT ok: $index"

  verify:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Keep CI on a stable CPython; local Windows may use 3.12–3.14.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Install build tools
        run: |
          choco install ninja llvm --no-progress -y
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Complete verification
        env:
          NEOMATH_RUN_LIVE_AI_TESTS: "0"
        run: scripts\verify_all.bat --software-only

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neomath-verification
          path: |
            desktop/build/reports/
